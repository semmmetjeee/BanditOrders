# Via Nieuwe bestelling kun je alle bruikbare Minecraft-items kiezen. Daarna vul je aantal en prijs in.
selection:
  size: 54
  title: "&#d9a441&lKIES EEN ITEM"
  # De buitenste rand bestaat uit grijze ruiten; items staan alleen in het midden.
