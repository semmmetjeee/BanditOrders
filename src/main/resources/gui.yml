# Alle menu-items zijn aanpasbaar. Knoppen werken via hun ingestelde slot, niet via naam of beschrijving.
# Zo blijven acties werken als je teksten aanpast. Menuformaten: 9 t/m 54 slots, deelbaar door 9. Slots beginnen bij 0.

border:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  lore: []
  glow: false

list:
  size: 54
  title: "&#d9a441&lMARKTBESTELLINGEN"
  content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  order-name: "&#d9a441%item%"
  order-lore:
    - "&7Koper: &#d9a441%buyer%"
    - "&7Gezocht: &#d9a441%remaining%&7/&f%total%"
    - "&7Prijs per stuk: &#d9a441%price%"
    - "&7Resterende waarde: &#d9a441%total_price%"
    - ""
    - "&#d9a441→ Klik om items te leveren"
  # Alleen zichtbaar voor spelers met banditbestellingen.admin.
  admin-lore:
    - ""
    - "&#e3262eQ → Verwijder deze bestelling als beheerder"
    - "&8Bestelling-ID: %id%"

  # Sorteerknop bovenaan.
  sort:
    enabled: true
    slot: 4
    material: HOPPER
    name: "&#d9a441&lSORTEREN: &f%sort%"
    lore:
      - "&7Huidig: &f%sort%"
      - "&7Volgende: &f%next_sort%"
      - ""
      - "&#d9a441→ Klik om te wijzigen"
    glow: false
    names:
      newest: "Nieuwste"
      oldest: "Oudste"
      price-desc: "Duurste per item"
      price-asc: "Goedkoopste per item"

  buttons:
    previous:
      enabled: true
      slot: 45
      material: ARROW
      name: "&fVorige pagina"
      lore:
        - "&7Ga naar pagina %page%."
    new-order:
      enabled: true
      slot: 48
      material: EMERALD
      name: "&#62dc91&lNIEUWE OPDRACHT"
      lore:
        - "&7Maak een nieuwe inkoopbestelling aan."
        - ""
        - "&#d9a441→ Klik om te beginnen"
    your-bestellingen:
      enabled: true
      slot: 49
      material: CHEST
      name: "&#55b7ff&lJOUW BESTELLINGEN"
      lore:
        - "&7Bekijk je bestellingen en opslag."
        - ""
        - "&#d9a441→ Klik om te openen"
    back:
      enabled: true
      slot: 50
      material: OAK_DOOR
      name: "&fTerug naar de markt"
      lore:
        - "&7Ga terug naar het hoofdmenu van de markt."
        - ""
        - "&#d9a441→ Klik om terug te gaan"
      # Commando dat als speler wordt uitgevoerd. Een slash aan het begin is optioneel.
      command: "markt"
    next:
      enabled: true
      slot: 53
      material: ARROW
      name: "&fVolgende pagina"
      lore:
        - "&7Ga naar pagina %page%."

