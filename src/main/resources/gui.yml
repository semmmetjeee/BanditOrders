  border:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    lore: []
    glow: false
  item:
    name: "&f%item%"
    lore:
      - ""
      - "&#d9a441→ Klik om dit item te kiezen"
  buttons:
    previous:
      enabled: true
      slot: 45
      material: ARROW
      name: "&fVorige pagina"
      lore:
        - "&7Ga naar pagina %page%."
    back:
      enabled: true
      slot: 49
      material: OAK_DOOR
      name: "&#d9a441&lTERUG NAAR OPDRACHTEN"
      lore:
        - "&7Ga terug naar het bestellingenmenu."
        - ""
        - "&#d9a441→ Klik om terug te gaan"
    next:
      enabled: true
      slot: 53
      material: ARROW
      name: "&fVolgende pagina"
      lore:
        - "&7Ga naar pagina %page%."

# Invoervenster voor aantal en prijs. Acties blijven werken als je teksten aanpast.
order-dialog:
  title: "&#d9a441&lMAAK OPDRACHT: %item%"
  input-width: 300
  button-width: 150
  amount:
    label: "&fAantal"
    initial: "1"
  price:
    label: "&fPrijs per stuk"
    initial: ""
  confirm:
    name: "&#62dc91&lBESTELLING AANMAKEN"
    tooltip: "&fMaak deze bestelling aan."
  cancel:
    name: "&#e3262e&lANNULEREN"
    tooltip: "&fAnnuleer deze bestelling."

delivery:
  size: 27
  title: "&#d9a441&lBESTELLING LEVEREN"
  # Alleen deze slots accepteren ingeleverde items. Ruiten, informatie en knoppen zijn beveiligd.
  input-slots: [10, 11, 12, 13, 14, 15, 16]
  info:
    slot: 4
    material: CHEST
    name: "&#d9a441&l%item%"
    lore:
      - "&7Plaats de juiste items in de lege vakken."
      - "&7Je ontvangt betaling wanneer je het menu sluit."
      - "&7Resterend: &#d9a441%remaining%"
      - "&7Prijs per stuk: &#d9a441%price%"
  buttons:
    back:
      enabled: true
      slot: 22
      material: OAK_DOOR
      name: "&#d9a441&lTERUG NAAR OPDRACHTEN"
      lore:
        - "&7Lever de juiste items in en geef"
        - "&7de overige items aan je terug."
        - ""
        - "&#d9a441→ Lever in en ga terug"

storage:
  size: 54
  title: "&#d9a441&lBESTELLINGOPSLAG &8(%page%/%pages%)"
