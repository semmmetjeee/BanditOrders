      material: ARROW
      name: "&fVorige pagina"
      lore:
        - "&7Ga naar pagina %page%."
    back:
      enabled: true
      slot: 49
      material: OAK_DOOR
      name: "&#d9a441&lTERUG NAAR OPDRACHTEN"
