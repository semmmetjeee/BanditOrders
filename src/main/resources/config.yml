# Primaire bestellingnaam/extra commandolabel. Voorbeeld: bestellingen.
# /orders blijft als compatibiliteitscommando beschikbaar. Herstart de server na een wijziging.
order-command: bestellingen

# Standaardlimiet als een speler geen banditorders.amount.<aantal>-permissie heeft.
# Bij meerdere aantalpermissies wordt het hoogste getal gebruikt, bijvoorbeeld banditorders.amount.10.
# Gebruik banditorders.amount.unlimited voor onbeperkt.
max-orders-per-player: 5
messages:
  prefix: "&#d9a441&lBESTELLINGEN &8» &f"
  no-permission: "%prefix%&cJe hebt geen toestemming om bestellingen te gebruiken."
  usage: "%prefix%&7Gebruik &f/%command%&7, &f/%command% mine&7, &f/%command% cancel <id>&7 of &f/%command% create <item|hand> <aantal> <prijs>&7."
  no-economy: "%prefix%&cVault en een economieprovider zijn vereist."
  invalid: "%prefix%&cGebruik: /%command% create <item|hand> <aantal> <prijs per stuk>"
  created: "%prefix%&aJe hebt een bestelling aangemaakt voor &#d9a441%amount%x %item% &avoor &#d9a441%price% &aper stuk."
  cancelled: "%prefix%&aBestelling &#d9a441%id% &ageannuleerd en &#d9a441%refund% &aterugbetaald."
  cancel-usage: "%prefix%&cGebruik: /%command% cancel <bestelling-id>"
  cancel-storage-not-empty: "%prefix%&cHaal eerst de &#d9a441%amount% &cingeleverde items uit deze bestelling op voordat je annuleert."
  # Oude sleutels blijven beschikbaar voor servers die nog /%command% delete gebruiken.
  deleted: "%prefix%&aJe bestelling is geannuleerd en &#d9a441%money% &ais terugbetaald."
  delete-usage: "%prefix%&cGebruik: /%command% delete <bestelling-id>"
  order-not-found: "%prefix%&cBestelling niet gevonden."
  refund-failed: "%prefix%&cTerugbetaling mislukt; de bestelling is behouden."
  full: "%prefix%&cJe hebt je limiet van &#d9a441%limit% &cactieve bestellingen bereikt."
  no-money: "%prefix%&cJe hebt niet genoeg geld voor deze bestelling."
  paid: "%prefix%&aJe hebt &#d9a441%amount%x %item% &avingeleverd en &#d9a441%money% &averdiend."
  payment-failed: "%prefix%&cDe betaling is mislukt. Je items zijn teruggegeven."
  storage-locked: "%prefix%&cDe opslag van deze bestelling is al geopend."
  completed-removed: "%prefix%&aVoltooide bestelling &#d9a441%id% &ais verwijderd nadat je alle items hebt opgehaald."

  # Validatiemeldingen voor het invoervenster voor nieuwe bestellingen.
  builder-invalid-amount: "%prefix%&cVul een geheel getal groter dan nul in."
  builder-invalid-price: "%prefix%&cVul een prijs groter dan nul in."
  builder-cancelled: "%prefix%&fHet aanmaken van de bestelling is geannuleerd."

  admin-deleted: "%prefix%&aBeheerder heeft bestelling &#d9a441%id% &avan &#d9a441%buyer% &averwijderd en &#d9a441%refund% &aterugbetaald."
  admin-deleted-owner: "%prefix%&cEen beheerder heeft bestelling &#d9a441%id% &cverwijderd. Je hebt &#d9a441%refund% &cteruggekregen."
  admin-delete-failed: "%prefix%&cBestelling &#d9a441%id% &ckon niet worden terugbetaald en is daarom behouden."
  admin-storage-not-empty: "%prefix%&cBestelling &#d9a441%id% &cbevat nog &#d9a441%amount% &cingeleverde items. De koper moet deze eerst ophalen."
  admin-info: "%prefix%&fEr zijn &#d9a441%orders% &fbestellingen geladen, waarvan &#d9a441%active% &factief zijn."
